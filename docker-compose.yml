services:
  moodle:
    container_name: moodle_develop
    privileged: true
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - '80:80'
    volumes:
      - logs:/var/log/apache2/
      - ./:/var/www/html
      - ./moodledata:/var/www/moodledata
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    restart: always
  cron:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: moodle-cron
    command: ["php", "/var/www/html/admin/cli/cron.php"]
    volumes:
      - ./:/var/www/html
      - ./moodledata:/var/www/moodledata
    depends_on:
      - moodle
    restart: always

volumes:
  logs:

networks:
  default:
    external: true
    name: network_interna_moodle
